# Dagger/Hilt 2.59+ 的 Hilt Gradle 插件要求 AGP 9；插件与运行时共用这一个版本号。
# 2.60 起 hilt-android 把 kotlin-stdlib 带到 2.3.x，而本仓编译器是 Kotlin 2.2（编译器能读高一版
# metadata，所以编得过）。曾因 Room 的 kapt 读不了 2.3 元数据卡在 2.59.x；Room 改走 KSP 后不再受限。
# 2.60 起 Hilt 要求 minSdk ≥ 23，且不允许手动设置由 Hilt 插件控制的 dagger.* 选项。
hilt = "2.60.1"
htmlTextView = "3.9"
interpolator = "1.0.0"
jsoup = "1.18.1"
junit4 = "4.13.2"
lifecycle = "2.8.7"
lottie = "6.7.1"
markwon = "4.6.2"
material = "1.14.0"
materialDateTimePicker = "4.2.3"
mmkv = "2.2.3"
mockWebServer = "4.12.0"
muzei = "3.4.2"
okhttp = "4.12.0"
onnxRuntime = "1.24.3-shaft-+"
orgJson = "20231013"
pixivLogin = "1.4.1"
playReview = "2.0.2"
recyclerView = "1.3.2"
relinker = "1.4.5"
retrofit = "2.11.0"
robolectric = "4.14.1"
room = "2.7.2"
roundedImageView = "2.3.0"
roundView = "1.8.0"
runner = "1.6.2"
