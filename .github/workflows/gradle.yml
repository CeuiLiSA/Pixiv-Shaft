name: CI

on:
  push:
    branches:
      - master
      - classic
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build apk (unsigned)
    runs-on: ubuntu-24.04

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4.2.2
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Detect branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

          if [ "$BRANCH_NAME" = "master" ]; then
            echo "APK_SUFFIX=master" >> $GITHUB_ENV
          elif [ "$BRANCH_NAME" = "classic" ]; then
            echo "APK_SUFFIX=classic" >> $GITHUB_ENV
          else
            echo "APK_SUFFIX=manual" >> $GITHUB_ENV
          fi

      # 无签名构建：不注入任何 keystore / Secrets。
      # app/build.gradle 在缺少 keystore 时自动降级为 Android 默认 debug 签名
      # （signingConfig hasShaftKeystore ? signingConfigs.shaft : signingConfigs.debug），
      # 因此 debug 与 release 两个变体都能正常产出可安装的 APK。
      - name: Build debug apk (unsigned)
        run: ./gradlew assembleGithubDebug

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug-${{ env.APK_SUFFIX }}
          path: app/build/outputs/apk/github/debug

      - name: Build release apk (unsigned, debug-signed)
        run: ./gradlew assembleGithubRelease

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-${{ env.APK_SUFFIX }}
          path: app/build/outputs/apk/github/release
