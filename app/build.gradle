    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'

    //=============== lifecycle
    def lifecycle_version = '2.8.7'

    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"



    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.core:core-ktx:1.13.1"
    // issue #931: 平板大屏双栏（Activity Embedding 分栏规则）
    implementation "androidx.window:window:1.5.1"
    // 原本由 navigation-fragment-ktx 传递引入,移除 Navigation 后需直接声明,
    // 提供 Fragment.viewModels() / activityViewModels() 等 KTX 扩展。
    implementation "androidx.fragment:fragment-ktx:1.8.5"

    api 'com.squareup.retrofit2:retrofit:2.11.0'
    api 'com.squareup.retrofit2:converter-gson:2.11.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'jp.wasabeef:glide-transformations:4.3.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
    implementation 'androidx.room:room-runtime:2.7.2'
    implementation "androidx.room:room-ktx:2.7.2"
    kapt 'androidx.room:room-compiler:2.7.2'
    implementation 'com.github.Justson.AgentWeb:agentweb-core:v4.1.9-androidx'
    implementation 'com.github.Justson.AgentWeb:agentweb-filechooser:v4.1.9-androidx'
    implementation 'com.facebook.rebound:rebound:0.3.8'
    implementation("org.sufficientlysecure:html-textview:3.9")
    implementation 'com.wdullaer:materialdatetimepicker:4.2.3'
    implementation 'com.mxn.soul:flowingdrawer-core:2.1.0'
    // flowingdrawer-core declares these classes in its animation path but its published POM omits
