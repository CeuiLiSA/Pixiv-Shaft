apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'kotlin-parcelize'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
// apply plugin: 'org.jmailen.kotlinter'  // 临时停用，见根 build.gradle

android {
    compileSdk 36


    defaultConfig {
        applicationId "ceui.pixiv"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 41900
        versionName "4.8.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a'
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [:]
            }
        }

        // Shaft community events server (shaft-api-v2). Secret is injected at
        // build time from ~/.gradle/gradle.properties or env (SHAFT_EVENTS_HMAC) —
        // never committed. Forks build with empty secret and get 401 from the
        // server, which is intentional: only official builds may post events.
        buildConfigField "String", "SHAFT_EVENTS_BASE_URL",
            '"' + (project.findProperty('SHAFT_EVENTS_BASE_URL') ?: 'http://36.138.103.18:30009') + '"'
        buildConfigField "String", "SHAFT_EVENTS_HMAC",
            '"' + (project.findProperty('SHAFT_EVENTS_HMAC') ?: System.getenv('SHAFT_EVENTS_HMAC') ?: '') + '"'
    }

    lint {
        // minSdk 24 但 compileSdk 36：越版本调用编译期无感，只在老机器上炸成
        // NoSuchMethodError（见 #953 CommentComposerView 的 requireViewById）。
        // 所以 lint 必须能卡住构建 —— 存量问题进 baseline，新引入的错误才报警。
        abortOnError true
        baseline = file('lint-baseline.xml')
        fatal 'NewApi'
    }

    // 签名材料不进 git。来源按优先级：
    //   1. 仓库根目录的 keystore.properties（gitignored，本机开发用）
    //   2. 环境变量 SHAFT_KEYSTORE_*（CI 从 Secrets 注入，见 .github/workflows/gradle.yml）
    //   3. 都没有 → fallback 到 Android 默认 debug 签名，外部贡献者 clone 即可构建
    def ksProps = new Properties()
    def ksPropsFile = rootProject.file("keystore.properties")
    if (ksPropsFile.exists()) {
        ksPropsFile.withInputStream { ksProps.load(it) }
    }
    def ksStoreFile = ksProps.getProperty("storeFile") ?: System.getenv("SHAFT_KEYSTORE_FILE")
    def ksStorePassword = ksProps.getProperty("storePassword") ?: System.getenv("SHAFT_KEYSTORE_PASSWORD")
    def ksKeyAlias = ksProps.getProperty("keyAlias") ?: System.getenv("SHAFT_KEY_ALIAS")
    def ksKeyPassword = ksProps.getProperty("keyPassword") ?: System.getenv("SHAFT_KEY_PASSWORD")
    def hasShaftKeystore = ksStoreFile != null && rootProject.file(ksStoreFile).exists()

    signingConfigs {
        if (hasShaftKeystore) {
            shaft {
                storeFile rootProject.file(ksStoreFile)
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            }
        }
    }

    flavorDimensions += "channel"
    productFlavors {
        google {
            dimension "channel"
            buildConfigField "String", "UPDATE_CHANNEL", '"google"'
            buildConfigField "boolean", "IS_LITE", "true"
        }
        github {
            dimension "channel"
            buildConfigField "String", "UPDATE_CHANNEL", '"github"'
            buildConfigField "boolean", "IS_LITE", "false"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            buildConfigField "boolean", "IS_DEBUG_MODE", "true"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // debug 也用正式 key（有的话）：跟历史行为一致，debug 包能覆盖安装旧 debug 包
            signingConfig hasShaftKeystore ? signingConfigs.shaft : signingConfigs.debug

            applicationIdSuffix ".cshaft"
            resValue "string", "app_name", "Shaft(Debug)"
        }
        release {
            minifyEnabled false
            buildConfigField "boolean", "IS_DEBUG_MODE", "false"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasShaftKeystore ? signingConfigs.shaft : signingConfigs.debug

            applicationIdSuffix ".pshaft"
            resValue "string", "app_name", "Shaft"
        }
    }

    // 按 flavor + buildType 生成一个可区分的名字,给 OutWakeActivity(pixiv 链接的
    // 「打开方式」处理器)当 label —— 同时装了多个 build 时在系统选择器里能分清是哪个。
    // github 渠道=Shaft、google(Play)渠道=PixShaft(沿用现有产品名),debug 追加 " Debug"。
    applicationVariants.all { variant ->
        def base = variant.flavorName == "google" ? "PixShaft" : "Shaft"
        def label = variant.buildType.name == "debug" ? base + " Debug" : base
        variant.resValue "string", "out_wake_label", label
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            //jni库的调用会到资源文件夹下libs里面找so文件
            jniLibs.srcDirs = ['libs']
        }
    }

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig = true // 启用 BuildConfig
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/MANIFEST.MF']
        }
    }

    namespace 'ceui.lisa'
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
}

// DateFormatPatternStringsTest 在运行时直接读 src/main/res 校验各 locale 的日期 pattern 字符串,
// 但 res 不在单测任务的默认输入里——不声明的话,纯翻译改动会被 up-to-date 跳过,守门形同虚设。
tasks.withType(Test).configureEach {
    inputs.dir('src/main/res').withPathSensitivity(PathSensitivity.RELATIVE)
}

dependencies {
    testImplementation("junit:junit:4.13.2")
    // websocket 测试(来自上游 Peanut)需要的 mock server 与协程测试调度器;
    // 版本分别对齐主依赖的 okhttp 4.12.0 / 传递解析出的 coroutines 1.10.2
    testImplementation("com.squareup.okhttp3:mockwebserver:4.12.0")
    testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2")
    testImplementation("androidx.arch.core:core-testing:2.2.0")
    // JVM 单测里 android.jar 的 org.json 是 Stub!,真实现放前面顶掉(AiTranslator 测试用)
    testImplementation("org.json:json:20231013")

    // AndroidX Test - JUnit Runner
    androidTestImplementation("androidx.test.ext:junit:1.1.5")
    androidTestImplementation("androidx.test.espresso:espresso-core:3.5.1")

    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'

    //=============== lifecycle
    def lifecycle_version = '2.8.7'

    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"



    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.core:core-ktx:1.13.1"
    // issue #931: 平板大屏双栏（Activity Embedding 分栏规则）
    implementation "androidx.window:window:1.5.1"
    // 原本由 navigation-fragment-ktx 传递引入,移除 Navigation 后需直接声明,
    // 提供 Fragment.viewModels() / activityViewModels() 等 KTX 扩展。
    implementation "androidx.fragment:fragment-ktx:1.8.5"

    api 'com.squareup.retrofit2:retrofit:2.11.0'
    api 'com.squareup.retrofit2:converter-gson:2.11.0'
    api 'com.squareup.retrofit2:adapter-rxjava2:2.9.0'

    api 'io.reactivex.rxjava2:rxjava:2.2.21'
    api 'io.reactivex.rxjava2:rxandroid:2.1.1'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
    implementation 'androidx.room:room-runtime:2.7.2'
    implementation "androidx.room:room-ktx:2.7.2"
    kapt 'androidx.room:room-compiler:2.7.2'
    implementation 'com.github.Justson.AgentWeb:agentweb-core:v4.1.9-androidx'
    implementation 'com.github.Justson.AgentWeb:agentweb-filechooser:v4.1.9-androidx'
    implementation 'com.facebook.rebound:rebound:0.3.8'
    implementation("org.sufficientlysecure:html-textview:3.9")
    implementation 'com.wdullaer:materialdatetimepicker:4.2.3'
    implementation 'com.qmuiteam:qmui:2.0.1'
    implementation 'com.mxn.soul:flowingdrawer-core:2.1.0'
    implementation 'com.ToxicBakery.viewpager.transforms:view-pager-transforms:2.0.24'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'jp.wasabeef:recyclerview-animators:4.0.2'
    implementation 'gdut.bsx:share2:0.9.3'
    implementation 'com.blankj:utilcodex:1.31.1'
    implementation 'com.safframework.log:saf-logginginterceptor:1.6.0'
    implementation 'com.google.firebase:firebase-analytics:22.1.2'
    implementation 'com.google.firebase:firebase-crashlytics:19.2.1'

    // Google Play In-App Review
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.android.play:review-ktx:2.0.2'

    implementation 'com.jaredrummler:colorpicker:1.1.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'


    implementation 'com.makeramen:roundedimageview:2.3.0'

    implementation 'io.github.csdn-mobile:RoundView:1.8.0'


    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // SSE 标准解析(AiTranslator 流式翻译):与 okhttp 同版本,按规范处理多行 data/CRLF/注释行
    implementation 'com.squareup.okhttp3:okhttp-sse:4.12.0'

    // Cronet (Chromium 网络栈) 提供 QUIC/HTTP3 支持，绕过 GFW 的 TCP RST
    implementation 'org.chromium.net:cronet-embedded:143.7445.0'

    def lottieVersion = "3.4.1"
    implementation "com.airbnb.android:lottie:$lottieVersion"

    implementation 'xyz.zpayh:hdimageview:3.0.2'

    implementation project(path: ':models')
    // 列表框架（FeedSource / FeedViewModel / FeedFragment / FeedAdapter）。对 pixiv 一无所知，
    // 宿主特有的东西由 ShaftFeedHost 在 Shaft.onCreate 注入，见 ceui.pixiv.feeds.host。
    implementation project(path: ':feeds')
    implementation project(path: ':progressmanager')
    implementation project(path: ':flowlayout-lib')
    implementation project(path: ':actionqueue')
    implementation 'com.tencent:mmkv-static:2.2.3'
    // 部分华为等 OEM 上 libmmkv.so 偶发 dlopen "not found"，ReLinker 兜底从 APK 抠 .so 按绝对路径加载。
    implementation 'com.getkeepsafe.relinker:relinker:1.4.5'

    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.browser:browser:1.8.0'

    // Pixiv OAuth 2.0 PKCE 登录（自家库，支持 Chrome Custom Tab）
    implementation 'com.github.SoxiaLiSA:pixiv-login:1.4.1'
    implementation 'org.jsoup:jsoup:1.18.1'

    implementation 'com.github.getActivity:Toaster:15.0'
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // ONNX Runtime for offline translation model inference
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.3'

    testImplementation 'junit:junit:4.13.2'

    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation 'org.honorato.multistatetogglebutton:multistatetogglebutton:0.2.2'
    implementation "io.noties.markwon:core:4.6.2"
    // Java language implementation
    implementation("androidx.activity:activity-ktx:1.9.3")
    implementation("com.google.android.flexbox:flexbox:3.0.0")

    implementation("io.github.panpf.zoomimage:zoomimage-view-sketch4:1.4.0")

    implementation("me.zhanghai.android.fastscroll:library:1.2.0")

    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'

    configurations {
        all*.exclude group: 'com.android.support', module: 'support-v13'
    }
}

//lintKotlin.dependsOn(formatKotlin)
