apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdk 36

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
        consumerProguardFiles 'consumer-rules.pro'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 本模块自带布局（dialog / popup / menu row），全部走 viewBinding —— 本仓第一个开
    // viewBinding 的 library 模块。刻意不开 dataBinding：库里没有一处需要 <layout> 表达式
    // 绑定，开了只是让每次构建多跑一遍注解处理。:app 的 dataBinding 与本模块无关。
    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    namespace 'ceui.pixiv.witstudio'

    // 刻意不设 resourcePrefix：全仓没有这个约定，而且本模块要接管一批 :app 既有资源名
    // （:app 侧留引用别名指过来，见 app/src/main/res/values/colors.xml 里 v3_* -> @color/wit_*
    // 那一段），强制前缀会把别名方案堵死。前缀纪律靠 wit_ 命名约定与 code review 维持。
}

kotlin {
    // 库模块：强制显式 public/internal + 显式返回类型。少了它，重构时很容易把本该
    // internal 的实现细节顺手暴露成 API，之后再收回来就是破坏性变更。同 :actionqueue。
    explicitApi()
}

dependencies {
    // 是 api 不是 implementation：这些类型长在本模块的**公开 API** 上，
    // 用 implementation 的话消费方必须自己另外声明才编得过。
    // 版本逐条对齐 :app，避免同一依赖两个版本并存。
    //
    // 今天真正用到的只有 appcompat（WitDialog : AppCompatDialog、
    // WitRoundButton : AppCompatButton）。
    api 'androidx.appcompat:appcompat:1.7.0'

    // ↓ 为后续阶段预留，**当前模块内一处未用**（grep 三个包名均为 0）。
    // 等着搬进来的是 :app 侧的 PixivDialog : DialogFragment、
    // V3BottomSheetBase(→WitBottomSheetBase) : BottomSheetDialogFragment、
    // DialogViewModel.alertTaskPool : CompletableDeferred。
    // 若那次搬迁最终没发生，这三条应当一并删掉——留着会让本模块的依赖面
    // 看起来比实际大，也和「只认识 View、Dialog 和一个 ?attr/colorPrimary」的定位不符。
    api 'androidx.fragment:fragment-ktx:1.8.5'
    api 'com.google.android.material:material:1.12.0'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'

    testImplementation 'junit:junit:4.13.2'

    // 刻意不引：
    //   - retrofit / glide / gson / :models / 任何 pixiv 业务代码 —— 本模块不认识
    //     「插画」「用户」，只认识 View、Dialog 和一个 ?attr/colorPrimary。
    //   - QMUI —— 本模块存在的意义就是把它替掉。
    //   - constraintlayout —— 库内布局一律 Linear/Frame，少一层依赖传染。
    //   - KSP —— 根 build.gradle 的「新模块一律 KSP」是针对需要注解处理的模块；
    //     纯 UI 库没有任何 processor，挂上只是空跑一个 task。将来若需要注解处理，
    //     用 KSP，不要用 kapt。
}
