    <linearGradient id="c-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#5b6ee1"/>
    </linearGradient>
    <linearGradient id="c-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#d9d4ff"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="c-a1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c6cff" stop-opacity=".75"/><stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
